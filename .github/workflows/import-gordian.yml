name: Importar base de Gordian
on: push
permissions:
  contents: write
jobs:
  importar:
    if: github.run_number == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Incorporar código e historial
        run: |
          git fetch https://github.com/facszero/gordian-game.git refs/heads/codex/windows-version
          test "$(git rev-parse FETCH_HEAD)" = 44ba639f5cec56e876a55a507ae545bdc5672d1a
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(git rev-parse 'FETCH_HEAD^{tree}')
          commit=$(git commit-tree "$tree" -p HEAD -p FETCH_HEAD -m "Copiar la base Godot de Gordian para Thundercats")
          git push origin "$commit:refs/heads/main"
